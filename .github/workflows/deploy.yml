name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build portfolio
        run: npm run build

      - name: Prepare static site
        shell: bash
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          if [ -d ".output/public" ]; then
            cp -a .output/public/. _site/
          elif [ -d "dist/client" ]; then
            cp -a dist/client/. _site/
          else
            echo "No static build output found"
            find . -maxdepth 3 -type d \( -name public -o -name client \) -print
            exit 1
          fi
          if [ -f "_site/_shell.html" ] && [ ! -f "_site/index.html" ]; then
            cp "_site/_shell.html" "_site/index.html"
          fi
          if [ -f "_site/index.html" ]; then
            cp "_site/index.html" "_site/404.html"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
